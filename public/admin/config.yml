backend:
  name: git-gateway
  branch: main

# Для локальной разработки раскомментируйте:
# local_backend: true

media_folder: public/images
public_folder: /images

locale: 'ru'

collections:
  # Настройки букмекера
  - name: 'settings'
    label: 'Настройки'
    files:
      - name: 'bookmaker'
        label: 'Букмекер'
        file: 'content/settings/bookmaker.json'
        fields:
          - { name: 'name', label: 'Название', widget: 'string' }
          - { name: 'logo', label: 'Логотип', widget: 'image', required: false }
          - { name: 'website', label: 'Сайт', widget: 'string' }
          - { name: 'rating', label: 'Рейтинг (1-5)', widget: 'number', min: 1, max: 5, step: 0.1 }
          - { name: 'description', label: 'Описание', widget: 'text' }
          - { name: 'license', label: 'Лицензия', widget: 'string' }
          - { name: 'founded', label: 'Год основания', widget: 'number' }
          - { name: 'minDeposit', label: 'Мин. депозит', widget: 'string' }
          - { name: 'minBet', label: 'Мин. ставка', widget: 'string' }
          - { name: 'company', label: 'Компания', widget: 'string' }
          - name: 'pros'
            label: 'Преимущества'
            widget: 'list'
            field: { name: 'item', label: 'Пункт', widget: 'string' }
          - name: 'cons'
            label: 'Недостатки'
            widget: 'list'
            field: { name: 'item', label: 'Пункт', widget: 'string' }

      - name: 'margins'
        label: 'Маржа по типам'
        file: 'content/settings/margins.json'
        fields:
          - name: 'types'
            label: 'Типы маржи'
            widget: 'list'
            fields:
              - { name: 'marketType', label: 'Тип рынка', widget: 'select', options: ['1X2', 'TOTAL', 'HANDICAP', 'BOTH_SCORE', 'DOUBLE_CHANCE'] }
              - { name: 'avgMargin', label: 'Средняя маржа (%)', widget: 'number', step: 0.1 }
              - { name: 'minMargin', label: 'Мин. маржа (%)', widget: 'number', step: 0.1 }
              - { name: 'maxMargin', label: 'Макс. маржа (%)', widget: 'number', step: 0.1 }
              - { name: 'sampleSize', label: 'Размер выборки', widget: 'number' }

  # Виды спорта
  - name: 'sports'
    label: 'Виды спорта'
    folder: 'content/sports'
    create: true
    extension: 'json'
    format: 'json'
    identifier_field: 'name'
    fields:
      - { name: 'name', label: 'Название', widget: 'string' }
      - { name: 'icon', label: 'Иконка (эмодзи)', widget: 'string' }
      - { name: 'eventsCount', label: 'Кол-во событий', widget: 'number' }
      - { name: 'marketsCount', label: 'Кол-во рынков', widget: 'number' }
      - { name: 'avgMargin', label: 'Средняя маржа (%)', widget: 'number', step: 0.1 }
      - { name: 'order', label: 'Порядок сортировки', widget: 'number', default: 0 }
